<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loan Application Demo</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Loan Application</h1><p class="intro">Complete the demo application below. This demonstration does not collect National ID, PIN, OTP, or other sensitive credentials.</p><form id="applicationForm"><label>Full Name<input name="name" placeholder="Your full name" required></label><label>Phone Number<input name="phone" placeholder="0712345678" required></label><label>Loan Amount (USD)<input name="amount" type="number" min="1" placeholder="500" required></label><label>Employment Status<select name="employment" required><option value="">Select employment status...</option><option>Employed</option><option>Self-employed</option><option>Student</option><option>Unemployed</option></select></label><label>Monthly Net Income (USD)<input name="income" type="number" min="0" step="0.01" placeholder="500.00" required></label><label>Repayment Period<select name="period" required><option value="">Select repayment period...</option><option>3 months</option><option>6 months</option><option>12 months</option></select></label><button id="submitBtn">Submit Application</button><p id="status"></p></form></main><script src="script.js"></script></body></html>
